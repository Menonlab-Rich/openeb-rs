[package]
name = "openeb-rs"
version = "0.2.0"
edition = "2024"
authors = ["Rich Baird <rich@rbaird.me>"]
description = "Deprecated compatibility crate for openevt"
license = "MIT"
repository = "https://github.com/richbai90/openevt"
documentation = "https://docs.rs/openeb-rs"

[features]
default = ["all"]
all = ["devices", "framegen", "plugins"]
devices = ["openevt/devices"]
framegen = ["openevt/framegen"]
plugins = ["openevt/plugins"]
python = ["openevt/python"]

[dependencies]
openevt = { path="..", version = "0.2.1", default-features = false }

[lib]
name = "openeb_rs"
path = "src/lib.rs"
