[package]
name = "openevt-plugins"
version = "1.0.1"
edition = "2024"

[dependencies]
ffmpeg-next = "8.1.0"
hotpath = "0.23"
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.1.4", features = ["serde"] }
openevt = { version = "1.0.1", default-features = false, features = ["devices", "plugins"], path = "../" }
abi_stable = "0.11.3"
rayon = "1.11"
thiserror = "2.0.19"
pyo3 = { version = "0.29.0", optional = true, features = ["extension-module"] }

[features]
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath/hotpath-alloc"]
python = ["dep:pyo3"]

[lib]
crate-type = ["rlib", "cdylib"]
