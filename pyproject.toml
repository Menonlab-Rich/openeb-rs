[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "openevt"
version = "0.1.2"
description = "Independent OpenEB-inspired event camera abstractions and Python bindings"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Rich Baird", email = "rich@rbaird.me" },
]
dependencies = [
    "numpy>=1.21",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]

[tool.maturin]
bindings = "pyo3"
features = ["python"]
strip = true
